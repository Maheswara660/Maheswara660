name: Generate Snake Contribution Animation

on:
  # Run automatically every hour to capture contribution updates across repositories
  schedule:
    - cron: "0 */1 * * *"
  
  # Allows to manually run the Job at any time
  workflow_dispatch:
  
  # Run on every push on the main branch
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Generates snake game animations matching GitHub contribution chart dots and blue snake (#087EE1)
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#087EE1&palette=github
            dist/github-contribution-grid-snake-dark.svg?color_snake=#087EE1&palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Slows down snake animation speed by 3x to match a classic regular snake game pacing
      - name: Adjust Snake Speed
        run: |
          python3 -c '
          import re, glob
          for path in glob.glob("dist/*.svg"):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              content = re.sub(r"(\d+)ms", lambda m: f"{int(int(m.group(1)) * 3)}ms", content)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
          '

      # Push the generated files to the output branch
      - name: Push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
